{% from "_icons.html" import icon, stitch %}
<section class="night page-hero">
  <span class="stars"></span>
  <div class="wrap">
    {% if crumbs %}<nav class="crumbs" aria-label="مسیر"><a href="{{ url_for('shop.home') }}">خانه</a>{% for label, href in crumbs %}<span aria-hidden="true">/</span>{% if href %}<a href="{{ href }}">{{ label }}</a>{% else %}<span>{{ label }}</span>{% endif %}{% endfor %}</nav>{% endif %}
    <h1>{{ page_title }}</h1>
    {% if page_sub %}<p>{{ page_sub }}</p>{% endif %}
  </div>
</section>
